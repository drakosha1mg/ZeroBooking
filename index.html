<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отель «Приморская» — выбор номера на карте</title>
<meta name="description" content="Выберите конкретный номер на интерактивном плане этажа отеля «Приморская».">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --background:oklch(0.982 0.012 92);--foreground:oklch(0.243 0.031 52);
  --card:oklch(0.995 0.006 95);--primary:oklch(0.46 0.088 168);--primary-fg:oklch(0.985 0.01 95);
  --secondary:oklch(0.935 0.026 92);--secondary-fg:oklch(0.31 0.036 52);
  --muted:oklch(0.945 0.018 92);--muted-fg:oklch(0.52 0.026 66);--border:oklch(0.895 0.02 88);
  --available:oklch(0.88 0.062 168);--available-fg:oklch(0.32 0.06 168);
  --occupied:oklch(0.9 0.022 60);--occupied-fg:oklch(0.58 0.02 60);
  --selected:oklch(0.46 0.088 168);--selected-fg:oklch(0.985 0.01 95);
  --shadow:0 2px 10px -4px oklch(0.243 0.031 52 / .18);
}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--background);color:var(--foreground)}
.display{font-family:Fraunces,Georgia,serif;font-weight:500}
.layout{display:grid;min-height:100vh;max-width:1920px;margin:auto}
@media(min-width:1024px){.layout{grid-template-columns:minmax(0,1fr) minmax(390px,38%)}}
.mapcol{display:flex;flex-direction:column;min-height:620px}
@media(min-width:1024px){.mapcol{min-height:100vh}}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:24px 24px 0}
.row{display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--border);background:var(--card);border-radius:8px;padding:4px;box-shadow:var(--shadow)}
button{font:inherit;cursor:pointer;border:0;background:transparent;color:inherit;border-radius:6px;padding:8px 16px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{background:var(--muted)}
button.on{background:var(--secondary)}
button.outline{border:1px solid var(--border);background:var(--card)}
button.icon{width:36px;height:36px;padding:0}
button.primary{background:var(--primary);color:var(--primary-fg)}
button.primary:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;color:var(--primary)}
.sub{padding:20px 28px 0;font-size:14px;color:var(--muted-fg)}
.mapwrap{position:relative;flex:1;min-height:440px;overflow:hidden}
@media(min-width:1024px){.mapwrap{min-height:660px}}
#viewport{position:absolute;inset:0;touch-action:none;user-select:none;cursor:grab}
#viewport.drag{cursor:grabbing}
#svg{position:absolute;left:0;top:0;transform-origin:top left;overflow:visible}
.overlay{pointer-events:none;position:absolute;left:24px;right:24px;bottom:20px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:12px;color:var(--muted-fg)}
.hint{max-width:62%;background:var(--card);padding:8px 12px;border-radius:8px;box-shadow:var(--shadow)}
.zoom{pointer-events:auto;display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:var(--shadow)}
.zoom span{width:40px;text-align:center;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:20px;border-top:1px solid var(--border);padding:16px 28px;font-size:12px;color:var(--muted-fg)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-2px}
aside{background:var(--card);border-top:1px solid var(--border)}
@media(min-width:1024px){aside{border-top:0;border-left:1px solid var(--border)}.panel{position:sticky;top:0;max-height:100vh;overflow-y:auto}}
.panel{max-width:750px;margin:auto;padding:28px 32px 40px}
.photo{aspect-ratio:1.8;overflow:hidden;border-radius:8px;background:var(--muted)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.card{margin-top:20px;background:var(--muted);border-radius:8px;padding:24px}
.muted{color:var(--muted-fg)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.full{width:100%;margin-top:20px}
label{display:block;font-size:12px;color:var(--muted-fg)}
input{display:block;width:100%;margin-top:4px;border:1px solid var(--border);background:var(--background);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px;color:var(--foreground)}
input:focus{outline:2px solid var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.item{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-top:6px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--border);margin-top:20px;padding-top:16px}
.status{margin-top:12px;background:var(--secondary);color:var(--secondary-fg);padding:12px;border-radius:8px;font-size:14px}
@media(max-width:639px){.brand-top{display:none}}
</style>
</head>

<main class="layout">
  <section class="mapcol" aria-label="Карта номеров">
    <div class="top">
      <div class="row">
        <div class="seg" id="floors" role="group" aria-label="Этаж"></div>

      </div>
      <div class="brand-top" style="text-align:right"><p class="eyebrow">Отель · Сочи</p><h1 class="display" style="font-size:24px">Приморская</h1></div>

    <div class="sub" id="sub"></div>
    <div class="mapwrap">
      <div id="viewport"><svg id="svg" role="img"></svg></div>

      </div>

    <div class="legend">

          <label>Выезд<input type="date" id="out" value="2026-10-05"></label>
        </div>
        <label style="margin-top:16px">Имя гостя<input id="guest" placeholder="Ваше имя"></label>
        <div id="list" style="margin-top:20px"></div>
        <div class="total"><span class="muted" id="nights" style="font-size:14px"></span><strong id="sum" style="font-size:20px"></strong></div>
        <button class="primary full" id="book" style="height:48px;font-size:16px">Забронировать</button>
        <div id="confirm"></div>
      </div>
    </div>
  </aside>
</main>

<script>
const TYPES=[{type:"Стандарт",beds:2,price:5400,view:"Во двор"},{type:"Комфорт",beds:2,price:7800,view:"На город"},{type:"Люкс",beds:3,price:13500,view:"На море"},{type:"Сьют",beds:4,price:19900,view:"Панорамный"}];
function buildFloor(i,id,name,subtitle){const rooms=[],cw=118,ch=96,g=14;
  for(let r=0;r<2;r++)for(let c=0;c<7;c++){const n=r*7+c,p=TYPES[(n+i)%4],num=`${i+1}${String(n+1).padStart(2,"0")}`,occ=(n*3+i*5)%7===0||(n+i)%11===3;
  rooms.push({id:`${id}-${num}`,number:num,type:p.type,beds:p.beds,price:p.price+i*700,free:!occ,view:r===0?p.view:"На сад",x:40+c*(cw+g),y:r===0?40:40+ch+90,w:cw,h:ch});}
  return{id,name,subtitle,rooms};}
const FLOORS=[buildFloor(0,"f1","1 этаж","Лобби, ресепшн, ресторан"),buildFloor(1,"f2","2 этаж","Тихое крыло, рядом спа"),buildFloor(2,"f3","3 этаж","Виды на набережную")];
const W=80+7*118+6*14,H=80+2*96+90,MIN=0.65,MAX=3;
const fmt=v=>new Intl.NumberFormat("ru-RU",{style:"currency",currency:"RUB",maximumFractionDigits:0}).format(v);
const nightsBetween=(a,b)=>{a=new Date(a).getTime();b=new Date(b).getTime();return isNaN(a)||isNaN(b)||b<=a?0:Math.round((b-a)/864e5)};
const $=id=>document.getElementById(id);
const S={floor:FLOORS[0],selected:[],inspected:null,freeOnly:false,scale:1,ox:0,oy:0,confirmed:null};
const vp=$("viewport"),svg=$("svg"),NS="http://www.w3.org/2000/svg";
svg.setAttribute("width",W);svg.setAttribute("height",H);
const el=(t,a,txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt)e.textContent=txt;return e};
const isSel=r=>S.selected.some(x=>x.id===r.id);

function geom(scale=S.scale){const w=vp.clientWidth||900,h=vp.clientHeight||700,base=Math.min((w-36)/W,(h-36)/H),a=base*scale;
  return{w,h,a,cx:(w-W*a)/2,cy:Math.min(80,Math.max(20,(h-H*a)/2))};}
function applyTransform(){const g=geom();svg.style.transform=`translate(${g.cx+S.ox}px,${g.cy+S.oy}px) scale(${g.a})`;$("zVal").textContent=Math.round(S.scale*100)+"%";}
function zoomAt(f,px,py){const prev=S.scale,next=Math.min(MAX,Math.max(MIN,prev*f)),o=geom(prev),n=geom(next);
  px=px??o.w/2;py=py??o.h/2;
  S.ox=px-(px-o.cx-S.ox)*next/prev-n.cx;S.oy=py-(py-o.cy-S.oy)*next/prev-n.cy;S.scale=next;applyTransform();}

function drawMap(){svg.innerHTML="";svg.setAttribute("aria-label","План этажа: "+S.floor.name);
  svg.append(el("rect",{x:20,y:20,width:W-40,height:H-40,rx:14,fill:"var(--card)",stroke:"var(--border)","stroke-width":2}));
  svg.append(el("rect",{x:34,y:H/2-26,width:W-68,height:52,rx:8,fill:"var(--secondary)"}));
  svg.append(el("text",{x:W/2,y:H/2+6,"text-anchor":"middle",fill:"var(--muted-fg)","font-size":15},"КОРИДОР"));
  for(const r of S.floor.rooms){const s=isSel(r),fill=s?"var(--selected)":r.free?"var(--available)":"var(--occupied)",tc=s?"var(--selected-fg)":r.free?"var(--available-fg)":"var(--occupied-fg)";
    const g=el("g",{role:"button",tabindex:r.free?0:-1,"aria-pressed":s,"aria-label":`Номер ${r.number}, ${r.type}, ${r.free?"свободен":"занят"}`});
    g.style.cursor=r.free?"pointer":"not-allowed";g.style.opacity=S.freeOnly&&!r.free?.25:1;
    g.append(el("rect",{x:r.x,y:r.y,width:r.w,height:r.h,rx:8,fill,stroke:s?"var(--primary)":"var(--border)","stroke-width":s?3:1.5}));
    g.append(el("text",{x:r.x+r.w/2,y:r.y+r.h/2-6,"text-anchor":"middle",fill:tc,"font-size":20,"font-weight":700},r.number));
    g.append(el("text",{x:r.x+r.w/2,y:r.y+r.h/2+16,"text-anchor":"middle",fill:tc,"font-size":12},r.type));
    g.addEventListener("click",()=>{if(drag&&drag.moved)return;S.inspected=r;if(r.free)toggle(r);else render();});
    g.addEventListener("keydown",e=>{if(r.free&&(e.key==="Enter"||e.key===" ")){e.preventDefault();S.inspected=r;toggle(r);}});
    g.addEventListener("pointerenter",()=>$("hint").textContent=`№${r.number} · ${r.type} · ${r.free?"свободен":"занят"}`);
    svg.append(g);}}

function toggle(r){S.confirmed=null;S.selected=isSel(r)?S.selected.filter(x=>x.id!==r.id):[...S.selected,r];render();}

function render(){
  $("floors").innerHTML="";
  for(const f of FLOORS){const b=document.createElement("button");b.textContent=f.name;if(f===S.floor)b.className="on";
    b.onclick=()=>{S.floor=f;S.inspected=null;S.scale=1;S.ox=S.oy=0;render();applyTransform();};$("floors").append(b);}
  $("freeBtn").className="icon "+(S.freeOnly?"on":"outline");
  $("sub").textContent=`${S.floor.subtitle} · ${S.floor.rooms.filter(r=>r.free).length} свободных номеров`;
  drawMap();
  const d=S.inspected||S.selected.at(-1)||S.floor.rooms.find(r=>r.free),c=$("roomCard");
  if(!d)c.innerHTML='<p class="muted">Выберите номер на карте</p>';
  else{c.innerHTML=`<div class="row" style="gap:12px"><h3 class="display" style="font-size:34px">Номер ${d.number}</h3><span class="dot" style="background:${d.free?"var(--primary)":"var(--occupied-fg)"}"></span></div>
    <div style="margin-top:12px"><span style="font-size:30px;font-weight:600">${fmt(d.price)}</span> <span class="muted" style="font-size:14px">за одну ночь</span></div>
    <p class="muted" style="margin-top:12px;font-size:14px">${d.type} · ${d.beds} места · ${d.view}</p>`;
    if(d.free){const b=document.createElement("button");b.className="full "+(isSel(d)?"on":"outline");b.textContent=isSel(d)?"✓ Номер выбран":"Выбрать номер";b.onclick=()=>toggle(d);c.append(b);}
    else c.insertAdjacentHTML("beforeend",'<p class="muted" style="margin-top:16px;font-size:14px">Этот номер занят</p>');}
  const n=nightsBetween($("in").value,$("out").value),l=$("list");l.innerHTML="";
  if(!S.selected.length)l.innerHTML='<p class="muted" style="font-size:14px">Выберите свободный номер на карте</p>';
  for(const r of S.selected){const row=document.createElement("div");row.className="item";row.innerHTML=`<span>№${r.number} · ${r.type}</span><span class="muted row" style="gap:4px">${fmt(r.price)}</span>`;
    const x=document.createElement("button");x.className="icon";x.style.cssText="width:28px;height:28px";x.textContent="✕";x.setAttribute("aria-label","Убрать номер "+r.number);x.onclick=()=>toggle(r);row.lastChild.append(x);l.append(row);}
  $("nights").textContent=n>0?`Итого · ${n} ноч.`:"Укажите корректные даты";
  $("sum").textContent=fmt(S.selected.reduce((s,r)=>s+r.price,0)*n);
  $("book").disabled=!S.selected.length||n<=0;
  $("confirm").innerHTML=S.confirmed?`<p class="status" role="status"></p>`:"";if(S.confirmed)$("confirm").firstChild.textContent=S.confirmed;
}

let drag=null;
vp.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,ox:S.ox,oy:S.oy,moved:false};vp.classList.add("drag");});
vp.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)>3||Math.abs(dy)>3)drag.moved=true;S.ox=drag.ox+dx;S.oy=drag.oy+dy;applyTransform();});
vp.addEventListener("pointerup",()=>{vp.classList.remove("drag");setTimeout(()=>drag=null,0);});
vp.addEventListener("pointerleave",()=>{drag=null;vp.classList.remove("drag");$("hint").textContent="Колесо мыши — масштаб · перетаскивание — перемещение";});
vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
$("zIn").onclick=()=>zoomAt(1.25);$("zOut").onclick=()=>zoomAt(1/1.25);
$("zReset").onclick=()=>{S.scale=1;S.ox=S.oy=0;applyTransform();};
$("freeBtn").onclick=()=>{S.freeOnly=!S.freeOnly;render();};
$("back").onclick=()=>{S.inspected=null;S.confirmed=null;render();};
for(const id of["in","out","guest"])$(id).addEventListener("input",()=>{S.confirmed=null;render();});
$("book").onclick=()=>{const g=$("guest").value,n=nightsBetween($("in").value,$("out").value);S.confirmed=`Бронь подтверждена${g?` для ${g}`:""}: номера ${S.selected.map(r=>r.number).join(", ")}, ${n} ноч.`;render();};
new ResizeObserver(applyTransform).observe(vp);
render();applyTransform();
    // 1. Адрес твоего запущенного сервера FastAPI
    const BACKEND_URL = "http://127.0.0.1:8000";
    let selectedRoom = null;

    // 2. Функция кнопки «Подобрать свободные номера»
    function handleSearchClick() {
        // Собираем данные в точном соответствии с твоим планом
        const payload = {
            first: document.getElementById('first').value,  // "27092026"
            secnd: document.getElementById('secnd').value,  // "28092026"
            time1: document.getElementById('time1').value,  // "1500"
            time2: document.getElementById('time2').value   // "1300"
        };

        // Отправляем POST-запрос с JSON в теле на бэкенд
        fetch(`${BACKEND_URL}/search`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => {
            if (!res.ok) throw new Error("Ошибка сервера при поиске");
            return res.json();
        })
        .then(data => {
            // Очищаем старые комнаты и показываем блок с результатами
            const grid = document.querySelector('.rooms-grid');
            grid.innerHTML = '';
            
            // Если бэк вернул массив свободных комнат, перестраиваем кнопки на лету
            if (data.rooms && data.rooms.length > 0) {
                data.rooms.forEach(roomNumber => {
                    const div = document.createElement('div');
                    div.className = 'room-node';
                    div.innerText = roomNumber;
                    div.onclick = () => handleRoomSelect(roomNumber, div);
                    grid.appendChild(div);
                });
            }
            
            document.getElementById('roomsWrapper').classList.remove('hidden');
        })
        .catch(err => {
            alert("Не удалось связаться с бэкендом для поиска комнат!");
            console.error(err);
        });
    }

    // 3. Интерактивный клик по карточке конкретной комнаты
    function handleRoomSelect(roomNumber, element) {
        selectedRoom = roomNumber;
        
        // Убираем старое выделение элементов стиля
        document.querySelectorAll('.room-node').forEach(node => node.classList.remove('selected'));
        // Выделяем текущую комнату
        element.classList.add('selected');
        
        // Открываем второй шаг (Анкету гостя)
        document.getElementById('guestStep').classList.remove('hidden');
    }

    // 4. Логика нажатия на кнопку финального бронирования
    function handleBookingSubmit() {
        if (!selectedRoom) {
            alert("Пожалуйста, выберите номер из списка доступных!");
            return;
        }

        // Собираем полный финальный JSON для отправки на бэк
        const payload = {
            first: document.getElementById('first').value,
            secnd: document.getElementById('secnd').value,
            time1: document.getElementById('time1').value,
            time2: document.getElementById('time2').value,
            name: document.getElementById('name').value,
            last_name: document.getElementById('lastName').value,
            phone: document.getElementById('phone').value
        };

        fetch(`${BACKEND_URL}/book`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(res => {
            // Если бэкенд выкинул HTTPException(status_code=400), выводим плашку "Занято"
            if (res.status === 400) {
                alert("Отказ бронирования: этот номер на выбранные вами даты уже занят!");
                throw new Error("Occupied");
            }
            if (!res.ok) throw new Error("Ошибка при создании брони");
            return res.json();
        })
        .then(data => {
            // Если всё успешно (200 OK), плавно переключаем экраны на финальный статус
            document.getElementById('searchStep').classList.add('hidden');
            document.getElementById('guestStep').classList.add('hidden');
            document.getElementById('successStep').classList.remove('hidden');
        })
        .catch(err => {
            console.error("Критическая ошибка связи:", err);
        });
    }
</script>
</body>
</html>
